[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghana-g2p"
version = "0.1.1"
description = "Grapheme-to-phoneme conversion for Ghanaian languages"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Ghana NLP" }]
keywords = ["g2p", "phonemes", "ipa", "ghana", "twi", "ewe", "dagbani", "tts", "asr"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  # Was pinned to a git commit, which PyPI refuses to accept in a published distribution
  # ("Can't have direct dependency"). africa-g2p 0.1.0 is that commit's descendant and carries
  # both fixes this depends on — #3 (composed rule keys reachable) and #4 (non-IPA symbols
  # removed from values) — so a version floor now expresses the same requirement. Neither is
  # patched around here, so an older africa-g2p would produce wrong phonemes rather than fail.
  "africa-g2p>=0.1.1",
]

[project.urls]
Homepage = "https://github.com/GhanaNLP/ghana-g2p"
Issues = "https://github.com/GhanaNLP/ghana-g2p/issues"

[project.scripts]
ghana-g2p = "ghana_g2p.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ghana_g2p"]

[tool.hatch.build.targets.sdist]
include = ["src/ghana_g2p", "tests", "README.md", "LICENSE", "pyproject.toml"]

# `allow-direct-references` is deliberately absent. It existed only to permit the git dependency
# above, and it is what lets an unpublishable distribution build without complaint — leaving it
# on means a future git reference fails at upload time instead of at build time.
